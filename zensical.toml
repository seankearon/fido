[project]
site_url = "https://seankearon.github.io/fido/"
site_name = "Fido"
site_description = "A launch manager for your IDE — give it a branch name and it opens the right worktree in Rider, WebStorm, VS Code, Visual Studio or Zed."
site_author = "Sean Kearon"

copyright = "Copyright &copy; 2026 Sean Kearon"

repo_url = "https://github.com/seankearon/fido"
repo_name = "seankearon/fido"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = [
    { "Discovery" = "guide/discovery.md" },
    { "Opening a target" = "guide/opening.md" },
    { "Deleting a worktree" = "guide/worktrees.md" },
    { "Editors and tools" = "guide/tools.md" },
    { "In-repo config" = "guide/in-repo-config.md" },
    { "The console" = "guide/interface.md" },
    { "Command line" = "guide/command-line.md" },
  ] },
  { "Reference" = [
    { "Settings" = "reference/settings.md" },
    { "At a glance" = "reference/at-a-glance.md" },
  ] },
  { "Screenshots" = "screenshots.md" },
  { "Building" = "building.md" },
  { "Changelog" = "changelog.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "assets/fido-icon.svg"
favicon = "assets/favicon.ico"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/seankearon/fido"

[project.plugins.search]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# The changelog page embeds the repo's own CHANGELOG.md rather than copying it.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
